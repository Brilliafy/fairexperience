buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.1.0'
group = 'com.brilliafy.fairexperience'
archivesBaseName = 'fairexperience'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.debug.export', 'true'
            mods { fairexperience { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'mixin.debug.export', 'true'
            mods { fairexperience { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.fairexperience.refmap.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'fairexperience',
            'Specification-Vendor'  : 'Brilliafy',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Brilliafy',
            'MixinConfigs'          : 'mixins.fairexperience.json'
        ])
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
